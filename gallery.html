const g=document.getElementById("gallery"), lb=document.getElementById("lb"), big=lb.querySelector("img");
photos.forEach(([mine,old],i)=>{
  const b=document.createElement("button"); b.type="button"; b.setAttribute("aria-label","Open photo "+(i+1));
  const im=new Image(); im.alt=""; im.loading="lazy";
  im.onerror=()=>{ if(old && !im.dataset.tried){ im.dataset.tried=1; im.src=old; } else { b.remove(); } };
  im.src=mine;
  b.append(im); g.append(b);
  b.onclick=()=>{ big.src=im.src; lb.classList.add("open"); document.getElementById("lbclose").focus(); };
});
const close=()=>lb.classList.remove("open");
document.getElementById("lbclose").onclick=close;
lb.onclick=e=>{ if(e.target===lb) close(); };
addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
